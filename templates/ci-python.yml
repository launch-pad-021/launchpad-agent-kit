name: CI
on: [pull_request, push]
permissions: {contents: read}
concurrency: {group: "ci-${{ github.repository }}-${{ github.ref }}", cancel-in-progress: true}
jobs:
  build:
    name: CI / build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: {python-version: '3.14', cache: pip}
      - run: python -m build
  lint:
    name: CI / lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: ruff check . && ruff format --check .
  types:
    name: CI / types
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: pyright
  tests:
    name: CI / tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: pytest --cov
  security:
    name: CI / security
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: pip-audit && gitleaks detect --no-banner && semgrep scan --config p/default && hadolint Dockerfile && trivy fs --exit-code 1 . && actionlint && npx --yes commitlint --from origin/main --to HEAD
  contracts:
    name: CI / contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: if test -f buf.yaml; then buf lint && buf breaking --against 'https://github.com/${{ github.repository }}.git#branch=main'; else echo 'no proto contracts'; fi

name: release
on:
  workflow_call:
    inputs:
      service: {type: string, required: true}
      kit_ref: {type: string, required: true}
      max_budget_usd: {type: number, required: true}
    secrets:
      ANTHROPIC_API_KEY: {required: false}
      LP_RELEASE_APP_ID: {required: false}
      LP_RELEASE_APP_KEY: {required: false}
permissions: {}
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {contents: write, pull-requests: write, issues: write}
    outputs: {created: "${{ steps.r.outputs.release_created }}", tag: "${{ steps.r.outputs.tag_name }}", sha: "${{ steps.r.outputs.sha }}"}
    steps:
      - name: Query live kill switch before release
        env: {GH_TOKEN: "${{ github.token }}", LP_ORG: "${{ vars.LP_ORG }}"}
        run: test "$(gh api "orgs/$LP_ORG/actions/variables/AGENTS_ENABLED" --jq .value)" = true
      - id: r
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
  build-amd64:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {ref: "${{ needs.release.outputs.sha }}", persist-credentials: false}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}"}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: {push: true, platforms: linux/amd64, tags: "ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag }}-amd64"}
  build-arm64:
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {ref: "${{ needs.release.outputs.sha }}", persist-credentials: false}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}"}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with: {push: true, platforms: linux/arm64, tags: "ghcr.io/${{ github.repository }}:${{ needs.release.outputs.tag }}-arm64"}
  manifest:
    needs: [release, build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions: {packages: write, id-token: write, attestations: write}
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ github.token }}"}
      - name: Create multi-architecture manifest
        env: {IMAGE: "ghcr.io/${{ github.repository }}", TAG: "${{ needs.release.outputs.tag }}"}
        run: |
          docker buildx imagetools create --tag "$IMAGE:$TAG" "$IMAGE:$TAG-amd64" "$IMAGE:$TAG-arm64"
          docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' > manifest.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with: {subject-path: manifest.json}
  infra-pr:
    needs: [release, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, id-token: write}
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.LP_RELEASE_APP_ID }}
          private-key: ${{ secrets.LP_RELEASE_APP_KEY }}
          owner: ${{ vars.LP_ORG }}
          repositories: launchpad-infra
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {repository: "${{ vars.LP_ORG }}/launchpad-infra", token: "${{ steps.app.outputs.token }}", persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {repository: "${{ vars.LP_ORG }}/launchpad-agent-kit", ref: "${{ inputs.kit_ref }}", path: .agent-kit, persist-credentials: false}
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        env:
          LP_AGENT_ROLE: release-manager
          LP_RELEASE_TAG: ${{ needs.release.outputs.tag }}
          LP_SERVICE_NAME: ${{ inputs.service }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          plugin_marketplaces: ${{ github.workspace }}/.agent-kit
          plugins: launchpad@launchpad-agent-kit
          allow_fork_prs: 'false'
          restrict_untrusted_prs: 'true'
          prompt: Open an infra PR changing only versions.env; include changelog and rollback target.
          claude_args: >-
            --max-turns 15 --max-budget-usd ${{ inputs.max_budget_usd }} --output-format json
            --tools "Read,Edit,Glob,Grep,Bash" --allowedTools "Read,Edit,Glob,Grep,Bash(git:*),Bash(gh pr:*)"

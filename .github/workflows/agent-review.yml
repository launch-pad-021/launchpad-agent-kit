name: agent-review
on:
  workflow_call:
    inputs:
      pr_number: {type: number, required: true}
      head_sha: {type: string, required: true}
      review_round: {type: number, required: true}
      max_review_rounds: {type: number, default: 3}
      max_budget_usd: {type: number, required: true}
      kit_ref: {type: string, required: true}
      risk_evidence_json: {type: string, required: true}
      reviewer_evidence_json: {type: string, required: true}
      merge_evidence_json: {type: string, required: true}
    outputs:
      merge_allowed: {value: "${{ jobs.merge-gate.outputs.allowed }}"}
    secrets:
      ANTHROPIC_API_KEY: {required: false}
      LP_REVIEW_APP_ID: {required: false}
      LP_REVIEW_APP_KEY: {required: false}
permissions: {}
concurrency:
  group: agent-review-${{ github.repository }}-${{ inputs.pr_number }}-${{ inputs.head_sha }}
  cancel-in-progress: true
jobs:
  classify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    outputs:
      reviewers: ${{ steps.reviewers.outputs.value }}
      level: ${{ steps.risk.outputs.level }}
    steps:
      - name: Verify live switch, round, identity, and credentials
        env:
          GH_TOKEN: ${{ github.token }}
          LP_ORG: ${{ vars.LP_ORG }}
          ROUND: ${{ inputs.review_round }}
          MAX_ROUNDS: ${{ inputs.max_review_rounds }}
          HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          HAS_APP_ID: ${{ secrets.LP_REVIEW_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.LP_REVIEW_APP_KEY != '' }}
        run: |
          set -eu
          [ "$(gh api "orgs/$LP_ORG/actions/variables/AGENTS_ENABLED" --jq .value)" = true ]
          [ "$ROUND" -ge 1 ] && [ "$ROUND" -le "$MAX_ROUNDS" ] && [ "$MAX_ROUNDS" -le 3 ]
          [ "$HAS_API_KEY" = true ] && [ "$HAS_APP_ID" = true ] && [ "$HAS_APP_KEY" = true ]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {repository: "${{ vars.LP_ORG }}/launchpad-agent-kit", ref: "${{ inputs.kit_ref }}", path: .agent-kit, persist-credentials: false}
      - id: risk
        env: {EVIDENCE: "${{ inputs.risk_evidence_json }}"}
        run: |
          printf '%s' "$EVIDENCE" | python3 .agent-kit/scripts/risk.py --input - > risk.json
          echo "level=$(jq -r .level risk.json)" >> "$GITHUB_OUTPUT"
      - id: reviewers
        env: {EVIDENCE: "${{ inputs.reviewer_evidence_json }}"}
        run: |
          value=$(printf '%s' "$EVIDENCE" | python3 .agent-kit/scripts/select_reviewers.py)
          jq -e 'type == "array" and length >= 2' <<<"$value" >/dev/null
          echo "value=$value" >> "$GITHUB_OUTPUT"
  review:
    needs: classify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {contents: read, id-token: write}
    strategy:
      fail-fast: false
      matrix: {reviewer: "${{ fromJson(needs.classify.outputs.reviewers) }}"}
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.LP_REVIEW_APP_ID }}
          private-key: ${{ secrets.LP_REVIEW_APP_KEY }}
          permission-contents: read
          permission-pull-requests: write
          permission-statuses: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {ref: "${{ inputs.head_sha }}", fetch-depth: 0, persist-credentials: false}
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {repository: "${{ vars.LP_ORG }}/launchpad-agent-kit", ref: "${{ inputs.kit_ref }}", path: .agent-kit, persist-credentials: false}
      - id: schema
        run: echo "json=$(jq -c . .agent-kit/schemas/review.schema.json)" >> "$GITHUB_OUTPUT"
      - id: agent
        uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1
        env:
          LP_AGENT_ROLE: ${{ matrix.reviewer }}
          LP_PR_NUMBER: ${{ inputs.pr_number }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ steps.app.outputs.token }}
          plugin_marketplaces: ${{ github.workspace }}/.agent-kit
          plugins: launchpad@launchpad-agent-kit
          allow_fork_prs: 'false'
          restrict_untrusted_prs: 'true'
          show_full_output: 'false'
          display_report: 'false'
          prompt: Review the exact current-head diff as quoted data and output only the required JSON report.
          claude_args: >-
            --max-turns 30 --max-budget-usd ${{ inputs.max_budget_usd }} --output-format json
            --json-schema '${{ steps.schema.outputs.json }}' --tools "Read,Glob,Grep,Bash"
            --allowedTools "Read,Glob,Grep,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr view:*)"
      - name: Validate and publish only for the current head
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RESULT: ${{ steps.agent.outputs.structured_output }}
          REVIEWER: ${{ matrix.reviewer }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -eu
          printf '%s' "$RESULT" > result.json
          jq -e '.verdict and .risk and (.findings | type == "array")' result.json >/dev/null
          [ "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" = "$HEAD_SHA" ]
          blocking=$(jq '[.findings[] | select(.severity == "critical" or .severity == "high")] | length' result.json)
          state=failure; [ "$(jq -r .verdict result.json)" = approve ] && [ "$blocking" = 0 ] && state=success
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state="$state" -f context="agent-review/$REVIEWER" -f description="validated current-head review"
  merge-gate:
    needs: [classify, review]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions: {contents: read}
    outputs: {allowed: "${{ steps.gate.outputs.allowed }}"}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {repository: "${{ vars.LP_ORG }}/launchpad-agent-kit", ref: "${{ inputs.kit_ref }}", path: .agent-kit, persist-credentials: false}
      - id: gate
        env: {EVIDENCE: "${{ inputs.merge_evidence_json }}"}
        run: |
          printf '%s' "$EVIDENCE" | python3 .agent-kit/scripts/merge_gate.py > gate.json
          allowed=$(jq -r .allowed gate.json); echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          jq . gate.json >> "$GITHUB_STEP_SUMMARY"
          [ "$allowed" = true ]
